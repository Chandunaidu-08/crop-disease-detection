<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">Crop Disease Detection</div>
        <ul class="nav-links">
           
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
            <li><a href="predict.html">Predict</a></li>
            <li><a href="login.html">Logout</a></li>
        </ul>
    </nav>

    <!-- Page Header -->
    <div class="contact-header">
        <h1>Contact Crop Disease Detection</h1>
        <p>Have questions or feedback? We would love to hear from you!</p>
    </div>

    <!-- Contact Form Section -->
    <section class="contact-section">
        <div class="container">
            <div class="contact-panel">
                <h2>Send us a message</h2>
                <form id="contactForm">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Your email" required>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message here" required></textarea>

                    <button type="submit">Send Message</button>
                </form>
                <p id="formStatus"></p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Crop Disease Detection. All rights reserved.</p>
    </footer>

    <!-- Script -->
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e){
            e.preventDefault();
            document.getElementById('formStatus').textContent = "Thank you for contacting us! We will get back to you soon.";
            this.reset();
        });
    </script>

</body>
</html>
